<!DOCTYPE html>
<html>

<head>
  <title>JavaScript testing</title>
  <meta charset="UTF-8">

<body class="bg-black items-center h-screen w-screen justify-center flex">
  <div class="flex justify-center w-full p-32" id="otherThing">
    <div class="w-full p-1 rounded-xl bg-gray-950 outline outline-white/5 border-4 border-gray-600 ">
      <div class="px-8 py-6">
        <div class="w-full text-center text-white font-bold text-xl">
          Please input a team name:
        </div>
        <br>
        <input type="text" name="Team name" id="teamName" maxlength="8"
          class="w-full border-separate rounded-sm border-4 border-cyan-400 bg-black text-white py-2 px-4 text-center">
      </div>
    </div>
  </div>
  <div
    class="h-full w-full flex pop-in p-8 fixed inset-0 items-center justify-center bg-linear-to-tr from-red-300 from-1% via-blue-900 via-25% to-black font-bold text-center text-white hidden"
    id="i">
    <div class="w-full h-3/4 px-16 py-8">
      <!-- bg-yellow-600 -->
      <div id="ii" class="hidden pop-in h-1/2 w-full my-4">
        <button onclick="noSpam()" id="button"
          class="timeOutCorner deactivate rounded-lg bg-amber-500 w-full h-full text-center text-6xl text-white duration-300 ease-in-out hover:scale-105">
          ANSWER BUTTON
        </button>
      </div>
      <div class="w-full h-1/6 p-4 bg-gray-900 pop-in hidden rounded-xl" id=iii>
        <div class="bg-red-600 h-full w-full timer hidden p-4" id="timer">
          <!-- the THIGN! -->
        </div>
      </div>
      <br>
      <div class="text-8xl pop-in hidden py-2" id="iiii">
        TEAM NAME
      </div>
      <div id="iiiii" class="hidden pop-in">
        <div class="text-7xl text-amber-500" id="score">
          0
        </div>
      </div>

    </div>
  </div>
  <div class="hidden h-full w-full p-8 fixed inset-0 flex items-center justify-center font-bold text-center text-white"
    id="popUp">
    <div class="h-9/10 w-9/10 rounded-lg border-4 border-red-600 bg-black text-center text-9xl content-center"
      id="popUpText">
      Another team is answering
    </div>
  </div>
  <div class="hidden h-full w-full p-8 fixed inset-0 flex items-center justify-center font-bold text-center text-white"
    id="dd">
    <div class="h-9/10 w-9/10 rounded-lg border-8 border-cyan-300 bg-blue-950 text-center text-5xl content-center"
      id="">
      <div class="py-8 text-white">
        Please enter your wager, or say it out loud
      </div>
      <input type="number" min="0" id="ddInput" class="p-8 bg-gray-900 border-4 border-amber-600 w-1/2 rounded-xl"
        onkeydown="checkEnter(this)" />

    </div>
  </div>


  <!-- I have no idea how this works!! I just stole it from the tailwind css website!! -->
  <div class="bottom-0 left-0 absolute p-4" id="theConnector">
    <div
      class="inline-flex border-2 border-gray-400 items-center rounded-md bg-blue-900 px-4 py-2 text-sm leading-6 font-semibold text-white"
      disabled="">
      <svg class="mr-3 -ml-1 size-5 animate-spin text-white" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
        </path>
      </svg>
      <div id="ctxt">
        Connecting…
      </div>
    </div>
  </div>



  <script src="fileRead.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js">
    import mqtt from 'mqtt';

  </script>
  <script src="player.js">
  </script>

  <script>
    // just for the daily double number input
    // worst code ever written right here, missed the forest for the trees
    // stolen from stack overflow <3
    document.getElementById("ddInput").addEventListener("keydown", function (evt) {
      if ((evt.which < 48 || evt.which > 57) && evt.keyCode !== 46 && evt.keyCode !== 8) {
        evt.preventDefault();
      }
    });
    document.getElementById("ddInput").addEventListener("keyup", function (evt) {
      if ((document.getElementById("ddInput").value) > parseInt(document.getElementById("score").innerHTML)
        && evt.keyCode !== 46
        && evt.keyCode !== 8
      ) {
        evt.preventDefault();
        document.getElementById("ddInput").value = (parseInt(document.getElementById("score").innerHTML));
      }
    });
  </script>
