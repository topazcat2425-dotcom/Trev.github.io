  <style>
    /* input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    } */

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
      /* Firefox */
    }

    .deactivate {
      animation: fade .5s forwards;
    }

    .activate {
      animation: fade .5s forwards;
      animation-direction: reverse;
    }

    @keyframes fade {
      0% {
        scale: 100%;
        opacity: 1;
      }

      100% {
        scale: 95%;
        opacity: 0.65;
      }
    }

    .pop-in {
      animation: zoom-in-a-lil .5s ease;
    }

    @keyframes zoom-in-a-lil {
      0% {
        scale: 0%;
      }

      65% {
        scale: 110%;
      }

      100% {
        scale: 100%
      }
    }

    .timer {
      animation: make-thinner 15s forwards;
    }

    @keyframes make-thinner {
      0% {
        transform: scaleX(1);
      }

      19% {
        transform: scaleX(1);
      }

      20% {
        transform: scaleX(.7);
      }

      39% {
        transform: scaleX(.7);
      }

      40% {
        transform: scaleX(.5);
      }

      59% {
        transform: scaleX(.5);
      }

      60% {
        transform: scaleX(.3);
      }

      79% {
        transform: scaleX(.3);
      }

      80% {
        transform: scaleX(.1);
      }


      99% {
        transform: scaleX(.1);
      }

      100% {
        transform: scaleX(0);
      }

      /* 100% {
        scale: 100%
      } */
    }
  </style>

    async function sleep(miliseconds) {
      var currentTime = new Date().getTime();
      var futureTime = currentTime + miliseconds;
      while (currentTime < futureTime) {
        currentTime = new Date().getTime()

    function negativeRed(div) {
      if (div.innerHTML < 0) {

        butt.classList.add('timeOutCorner');

    function hide(ID) {
      // console.log("hiding");
      const contain = document.getElementById(ID);
      if (!contain.classList.contains("hidden")) {
        contain.classList.add("hidden");
      }
    }

    function show(ID) {
      // console.log("showing");
      const contain = document.getElementById(ID);
      if (contain.classList.contains("hidden")) {
        contain.classList.remove("hidden");
      }
    }

  <script>
    // just for the daily double number input
    // worst code ever written right here, missed the forest for the trees
    // stolen from stack overflow <3
    document.getElementById("ddInput").addEventListener("keypress", function (evt) {
      if (evt.which < 48 || evt.which > 57) {
        evt.preventDefault();
      } else if ((document.getElementById("ddInput").value) > parseInt(document.getElementById("score").innerHTML)
        && evt.keyCode !== 46
        && evt.keyCode !== 8
      ) {
        evt.preventDefault();
        document.getElementById("ddInput").value = (parseInt(document.getElementById("score").innerHTML));
      }
    });
