    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            0% {
                rotate: 0deg;
            }

            25% {
                rotate: 90deg;
            }

            50% {
                rotate: 180deg;
            }

            75% {
                rotate: 270deg;
            }

            100% {
                rotate: 360deg;
            }
        }

        .wack {
            animation: rotate360 .75s linear infinite;
            /* animation set */
            animation-play-state: paused;
            /* ...but paused */
        }

        .wack:hover {
            animation-play-state: running;
        }

        @keyframes rotate360 {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <style>
        p {
            color: white;
            font-size: x-large;
            font-weight: bold;
            padding: 1%;
        }

        body {

        }

        .trev {
            size: 75%, 75%;
        }

        .rightPicture {
            position: fixed;
            /* position: flex; */
            float: right;
            float: top;
            transform: scale(.5);
            /* size: 75%, 75%; */
            /* overflow: hidden; */
        }

        .circle {
            margin: 3%;
            /* overflow: hidden; */
            position: relative;
            background-color: #610F7F;
            border-radius: 50%;
            padding: 5%;
            /* display: inline-block; */
        }

        .hyperLinks {
            color: 9C528B;
            font: italic;
            font-size: x-large;
            padding: .5%;
        }

        .wackAssBox {
            rotate: 15deg;
            background-color: darkslategray;
            height: 110%;
            width: 30%;
            size: 100%, 100%;
        }



        @keyframes slide-in {
            from {
                translate: -150vw 0;
            }

            to {
                translate: 0 0;
            }
        }
    </style>
</head>
